<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Platform - Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" style="text-decoration: none;">
                <h1 class="logo">🧠 AGI Platform</h1>
            </a>
            <div class="nav-links">
                <a href="/" class="active">Dashboard</a>
                <a href="/memories">Memories</a>
                <a href="#" id="stats-link">Stats</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h2>Recursive Agent Dashboard</h2>
            <button id="new-task-btn" class="btn btn-primary">+ New Task</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-tasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="processing-tasks">0</div>
                <div class="stat-label">Processing</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completed-tasks">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="failed-tasks">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card cost-card">
                <div class="stat-value cost-value" id="total-cost">$0.00</div>
                <div class="stat-label">Total Cost</div>
            </div>
            <div class="stat-card cost-card">
                <div class="stat-value cost-value" id="avg-cost">$0.00</div>
                <div class="stat-label">Avg per Task</div>
            </div>
        </div>

        <div class="section">
            <h3>Recent Tasks</h3>
            <div id="tasks-container" class="tasks-list">
                <div class="loading">Loading tasks...</div>
            </div>
        </div>
    </div>

    <!-- New Task Modal -->
    <div id="new-task-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create New Task</h2>
            <form id="new-task-form">
                <div class="form-group">
                    <label>Task Title</label>
                    <input type="text" id="task-title" placeholder="Enter a short title for this task..." required>
                </div>
                <div class="form-group">
                    <label>Task Description</label>
                    <textarea id="task-description" rows="4" placeholder="Describe the task in detail..." required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Max Depth</label>
                        <input type="number" id="max-depth" value="5" min="1" max="10">
                    </div>
                    <div class="form-group">
                        <label>Max Agents</label>
                        <input type="number" id="max-agents" value="50" min="1" max="100">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Submit Task</button>
            </form>
        </div>
    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
